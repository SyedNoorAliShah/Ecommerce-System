name: Deploy to Azure ACR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure ACR
        uses: azure/docker-login@v1
        with:
          login-server: ecommerceacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ecommerceacr.azurecr.io/ecommerce-system:${{ github.sha }} .
          docker tag ecommerceacr.azurecr.io/ecommerce-system:${{ github.sha }} \
                     ecommerceacr.azurecr.io/ecommerce-system:latest

      - name: Push to Azure ACR
        run: |
          docker push ecommerceacr.azurecr.io/ecommerce-system:${{ github.sha }}
          docker push ecommerceacr.azurecr.io/ecommerce-system:latest

      - name: Success!
        run: echo "✅ Image successfully pushed to Azure ACR!"